[build]
builder = "nixpacks"

[deploy]
# migrate + collectstatic + gunicorn no startCommand.
# Motivo: a rede privada do Railway (para falar com Postgres) só está
# disponível quando o container está em execução, não durante o build.
# Rodar migrate no release/build falha com DNS error em postgres.railway.internal.
# Alternativa: tudo no start — migrate é idempotente, collectstatic também.
startCommand = "python manage.py migrate --no-input && python manage.py collectstatic --no-input && gunicorn topfilme.wsgi:application --log-file - --bind 0.0.0.0:$PORT"

# Health check — /admin/login/ é a rota mais confiável do Django
healthcheckPath = "/admin/login/"
healthcheckTimeout = 60

restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
